<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÍSTICO — Reserva de Turnos</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body{background:#0a0f2b; color:#e0e0ff; padding:20px; max-width:500px; margin:0 auto;}
        .cabecera{text-align:center; padding:20px;}
        .logo{max-width:150px; margin-bottom:10px;}
        h1{color:#d4af37; font-size:32px; letter-spacing:4px;}
        .nav{display:flex; gap:10px; margin:20px 0;}
        .btn{flex:1; padding:12px; background:transparent; border:1px solid #d4af37; color:#fff; border-radius:6px; cursor:pointer; font-size:15px;}
        .btn.activo{background:#d4af37; color:#000; font-weight:bold;}
        .oculto{display:none !important;}
        .caja{background:#1a1f45; padding:20px; border-radius:10px; margin-bottom:15px; border:1px solid rgba(212,175,55,0.2);}
        label{display:block; margin:12px 0 5px; color:#b0b0e0;}
        input, select, button{width:100%; padding:12px; border:none; border-radius:6px; font-size:16px;}
        input, select{background:#0f1433; color:#fff; border:2px solid rgba(212,175,55,0.2);}
        .btn-amarillo{background:#d4af37; color:#000; font-weight:bold; margin-top:10px; cursor:pointer;}
        .btn-verde{background:#25D366; color:#fff; font-weight:bold; margin-top:15px; text-decoration:none; display:block; text-align:center; padding:12px; border-radius:6px;}
        .resumen{background:#0f1433; padding:15px; border-radius:6px; margin:15px 0; line-height:2;}
        .resumen strong{color:#d4af37;}
        .exito{color:#2ecc71; font-size:18px; font-weight:bold; text-align:center; margin:15px 0;}
    </style>
</head>
<body>

<div class="cabecera">
    <img src="https://i.imgur.com/8ZxXQfL.png" alt="Logo Místico" class="logo" onerror="this.style.display='none'">
    <h1>MÍSTICO</h1>
    <p style="color:#9999cc; margin-top:5px;">Reserva tu turno</p>
</div>

<div class="nav">
    <button class="btn activo" id="btnRes" onclick="irA('reservar')">📅 Reservar</button>
    <button class="btn" id="btnAdm" onclick="irA('admin')">🔧 Configuración</button>
</div>

<div id="reservar" class="caja">
    <h2 style="color:#d4af37; margin-bottom:20px;">📅 Pedí tu Turno</h2>

    <div id="formRes">
        <label>Barbero *</label>
        <select id="selBarbero">
            <option value="">— Elegí —</option>
            <option>Carlos</option>
            <option>Martín</option>
            <option>Juan</option>
        </select>

        <label>Servicio *</label>
        <select id="selServicio">
            <option value="">— Elegí —</option>
            <option>Corte de cabello</option>
            <option>Arreglo de barba</option>
            <option>Corte + Barba</option>
            <option>Afeitado clásico</option>
        </select>

        <label>Fecha *</label>
        <input type="date" id="selFecha">

        <label>Horario *</label>
        <select id="selHora">
            <option value="">— Elegí —</option>
            <option>09:00</option><option>09:30</option><option>10:00</option>
            <option>10:30</option><option>11:00</option><option>11:30</option>
            <option>15:00</option><option>15:30</option><option>16:00</option>
            <option>16:30</option><option>17:00</option><option>17:30</option>
            <option>18:00</option>
        </select>

        <label>Tu Nombre *</label>
        <input type="text" id="inpNombre" placeholder="Ej: Juan Pérez">

        <label>Tu WhatsApp *</label>
        <input type="tel" id="inpTel" placeholder="+54 9 294 ...">

        <button class="btn-amarillo" onclick="generarTurno()">✅ ARMAR TURNO</button>
    </div>

    <div id="confirmado" class="oculto">
        <div class="exito">✅ ¡TURNO LISTO!</div>
        <div class="resumen">
            <strong>Nombre:</strong> <span id="rNombre"></span><br>
            <strong>Barbero:</strong> <span id="rBarbero"></span><br>
            <strong>Servicio:</strong> <span id="rServicio"></span><br>
            <strong>Fecha:</strong> <span id="rFecha"></span><br>
            <strong>Hora:</strong> <span id="rHora"></span>
        </div>
        <a id="botonWA" class="btn-verde" href="" target="_blank">💬 ENVIAR POR WHATSAPP</a>
        <button class="btn-amarillo" style="background:#444; color:#fff;" onclick="volver()">🔄 Volver</button>
    </div>
</div>

<div id="admin" class="caja oculto">
    <h2 style="color:#d4af37; margin-bottom:20px;">🔧 Configuración</h2>

    <label>Contraseña</label>
    <input type="password" id="passAdmin" placeholder="Escribí contraseña">
    <button class="btn-amarillo" onclick="entrarConfig()">Ingresar</button>

    <div id="panelConfig" class="oculto" style="margin-top:20px;">
        <p style="color:#999; font-size:13px; margin-bottom:10px;">Tu WhatsApp (solo números, ej: 5492941234567)</p>
        <input type="tel" id="miWA" placeholder="Ej: 5492941234567">
        <button class="btn-amarillo" onclick="guardarWA()">💾 GUARDAR NÚMERO</button>
        <p id="guardadoMsg" style="color:#2ecc71; margin-top:10px; display:none;">✅ ¡Guardado!</p>
    </div>
</div>

<script>
function irA(pagina){
    document.getElementById('reservar').classList.add('oculto');
    document.getElementById('admin').classList.add('oculto');
    document.getElementById(pagina).classList.remove('oculto');
    
    document.getElementById('btnRes').classList.remove('activo');
    document.getElementById('btnAdm').classList.remove('activo');
    if(pagina==='reservar') document.getElementById('btnRes').classList.add('activo');
    if(pagina==='admin') document.getElementById('btnAdm').classList.add('activo');
}

function entrarConfig(){
    const pass = document.getElementById('passAdmin').value;
    if(pass === 'admin123'){
        document.getElementById('panelConfig').classList.remove('oculto');
        const wa = localStorage.getItem('miWhatsApp') || '';
        document.getElementById('miWA').value = wa;
    }else{
        alert('❌ Contraseña incorrecta');
    }
}

function guardarWA(){
    const num = document.getElementById('miWA').value.replace(/[^0-9]/g,'');
    if(num.length < 10){ alert('⚠️ Número muy corto'); return; }
    localStorage.setItem('miWhatsApp', num);
    document.getElementById('guardadoMsg').style.display = 'block';
    setTimeout(()=>document.getElementById('guardadoMsg').style.display='none', 2500);
}

function generarTurno(){
    const nombre = document.getElementById('inpNombre').value.trim();
    const barbero = document.getElementById('selBarbero').value;
    const servicio = document.getElementById('selServicio').value;
    const fecha = document.getElementById('selFecha').value;
    const hora = document.getElementById('selHora').value;
    const tel = document.getElementById('inpTel').value.trim();
    const miWA = localStorage.getItem('miWhatsApp');

    if(!nombre||!barbero||!servicio||!fecha||!hora||!tel){
        alert('⚠️ Completá todos los campos'); return;
    }
    if(!miWA){
        alert('⚠️ Andá a Configuración y cargá tu WhatsApp primero');
        irA('admin'); return;
    }

    const mensaje = `Hola! Quisiera reservar un turno en MÍSTICO:

👤 Nombre: ${nombre}
📞 Mi WhatsApp: ${tel}
✂️ Barbero: ${barbero}
💇 Servicio: ${servicio}
📅 Fecha: ${fecha}
⏰ Hora: ${hora}

¡Gracias!`;

    const enlace = https://wa.me/${miWA}?text=${encodeURIComponent(mensaje)};

    document.getElementById('formRes').classList.add('oculto');
    document.getElementById('confirmado').classList.remove('oculto');

    document.getElementById('rNombre').textContent = nombre;
    document.getElementById('rBarbero').textContent = barbero;
    document.getElementById('rServicio').textContent = servicio;
    document.getElementById('rFecha').textContent = fecha;
    document.getElementById('rHora').textContent = hora;
    document.getElementById('botonWA').href = enlace;
}

function volver(){
    document.getElementById('formRes').classList.remove('oculto');
    document.getElementById('confirmado').classList.add('oculto');
    document.getElementById('inpNombre').value='';
    document.getElementById('selBarbero').value='';
    document.getElementById('selServicio').value='';
    document.getElementById('selFecha').value='';
    document.getElementById('selHora').value='';
    document.getElementById('inpTel').value='';
}

const hoy = new Date().toISOString().split('T')[0];
document.getElementById('selFecha').min = hoy;
</script>

</body>
</html>
