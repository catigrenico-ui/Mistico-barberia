<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÍSTICO — Reserva de Turnos</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body{background:#0a0f2b; color:#e0e0ff; padding:20px; max-width:580px; margin:0 auto; min-height:100vh;}
        .cabecera{text-align:center; padding:20px; margin-bottom:15px;}
        h1{color:#d4af37; font-size:30px; letter-spacing:4px;}
        .subtitulo{color:#9999cc; font-size:14px; margin-top:5px;}
        .caja{background:#1a1f45; padding:22px; border-radius:12px; margin-bottom:20px; border:1px solid rgba(212,175,55,0.2);}
        h2{color:#d4af37; font-size:18px; margin-bottom:18px; padding-bottom:8px; border-bottom:1px solid rgba(212,175,55,0.2);}
        label{display:block; margin:12px 0 5px; color:#b0b0e0; font-size:14px; font-weight:500;}
        input, select, button{width:100%; padding:14px 12px; border:none; border-radius:8px; font-size:15px;}
        input, select{background:#0f1433; color:#fff; border:2px solid rgba(212,175,55,0.3); outline:none;}
        input:focus, select:focus{border-color:#d4af37;}
        .btn{padding:14px 20px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;}
        .btn-amarillo{background:#d4af37; color:#000; margin-top:15px; width:100%;}
        .btn-verde{background:#25D366; color:#fff; margin-top:15px; width:100%; text-decoration:none; display:block; text-align:center; padding:14px; border-radius:8px; font-weight:bold;}
        .btn-rojo{background:#e74c3c; color:#fff; padding:8px 12px; font-size:13px; width:auto; border-radius:6px;}
        .btn-chico-ok{background:#27ae60; color:#fff; padding:8px 12px; font-size:13px; width:auto; border-radius:6px;}
        .btn-chico-gris{background:#555; color:#fff; padding:8px 12px; font-size:13px; width:auto; border-radius:6px;}
        .fila{display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap;}
        .lista{margin-top:12px;}
        .item{display:flex; justify-content:space-between; align-items:center; padding:14px; background:#0f1433; border-radius:8px; margin-bottom:8px; border-left:3px solid #d4af37; flex-wrap:wrap; gap:8px;}
        .item.atendido{border-left-color:#27ae60; opacity:0.7;}
        .etiqueta-atendido{background:#27ae60; color:#fff; font-size:11px; padding:3px 10px; border-radius:12px; margin-left:8px;}
        .filtros{display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;}
        .filtro{padding:8px 14px; background:transparent; border:1px solid #666; color:#ccc; border-radius:20px; font-size:13px; cursor:pointer; width:auto;}
        .filtro.activo{border-color:#d4af37; color:#d4af37; background:rgba(212,175,55,0.1);}
        .btn-admin-pequeño{position:fixed; top:15px; right:15px; background:transparent; border:none; color:#555; font-size:22px; cursor:pointer; z-index:100;}
        .pass-box{max-width:340px; margin:0 auto; text-align:center;}
        .resumen{background:#0f1433; padding:18px; border-radius:10px; margin:15px 0; line-height:2.2;}
        .exito{color:#2ecc71; font-size:20px; font-weight:bold; text-align:center; margin:15px 0;}
        .oculto{display:none !important;}
        .ayuda{color:#888; font-size:12px; margin-top:4px;}
    </style>
</head>
<body>

<button class="btn-admin-pequeño" onclick="irA('admin')" title="Solo para dueño">⚙️</button>

<div class="cabecera">
    <h1>MÍSTICO</h1>
    <p class="subtitulo">Reserva de Turnos</p>
</div>

<div id="reservar">
    <div class="caja">
        <h2>📅 Pedí tu Turno</h2>
        <div id="formRes">
            <label>👨‍🦱 Barbero *</label>
            <select id="selBarbero" onchange="cargarHorariosDisponibles()">
                <option value="">— Elegí el barbero —</option>
                <option value="Carlos">Carlos</option>
                <option value="Martín">Martín</option>
                <option value="Juan">Juan</option>
            </select>

            <label>💇 Servicio *</label>
            <select id="selServicio">
                <option value="">— Elegí el servicio —</option>
                <option value="Corte de cabello">Corte de cabello — $5.000</option>
                <option value="Arreglo de barba">Arreglo de barba — $3.500</option>
                <option value="Corte + Barba">Corte + Barba — $7.500</option>
                <option value="Afeitado clásico">Afeitado clásico — $4.000</option>
            </select>

            <label>📅 Fecha *</label>
            <input type="date" id="selFecha" onchange="cargarHorariosDisponibles()">

            <label>⏰ Horario Disponible *</label>
            <select id="selHora">
                <option value="">— Elegí barbero y fecha primero —</option>
                <option value="09:00">09:00</option>
                <option value="09:30">09:30</option>
                <option value="10:00">10:00</option>
                <option value="10:30">10:30</option>
                <option value="11:00">11:00</option>
                <option value="11:30">11:30</option>
                <option value="15:00">15:00</option>
                <option value="15:30">15:30</option>
                <option value="16:00">16:00</option>
                <option value="16:30">16:30</option>
                <option value="17:00">17:00</option>
                <option value="17:30">17:30</option>
                <option value="18:00">18:00</option>
            </select>
            <p class="ayuda">Los horarios ocupados se desactivan solos</p>

            <label>👤 Tu Nombre Completo *</label>
            <input type="text" id="inpNombre" placeholder="Ej: Juan Pérez">

            <label>📱 Tu WhatsApp / Teléfono *</label>
            <input type="tel" id="inpTel" placeholder="Ej: +54 9 298 454-8329">

            <button class="btn btn-amarillo" onclick="generarTurno()">✅ ARMAR TURNO</button>
        </div>

        <div id="confirmado" class="oculto">
            <div class="exito">✅ ¡TURNO CONFIRMADO!</div>
            <div class="resumen">
                <strong>Nombre:</strong> <span id="rNombre"></span><br>
                <strong>Barbero:</strong> <span id="rBarbero"></span><br>
                <strong>Servicio:</strong> <span id="rServicio"></span><br>
                <strong>Fecha:</strong> <span id="rFecha"></span><br>
                <strong>Hora:</strong> <span id="rHora"></span>
            </div>
            <a id="botonWA" class="btn-verde" href="" target="_blank" rel="noopener">💬 ENVIAR POR WHATSAPP</a>
            <button class="btn btn-amarillo" style="background:#444; color:#fff;" onclick="volver()">🔄 Volver</button>
        </div>
    </div>
</div>

<div id="admin" class="oculto">
    <div class="caja pass-box" id="cajaPass">
        <h2 style="text-align:center; border:none;">🔒 Panel de Control</h2>
        <input type="password" id="passAdmin" placeholder="Contraseña">
        <button class="btn-amarillo" onclick="ingresar()">Entrar</button>
        <button class="btn-chico-gris" style="margin-top:15px; width:auto;" onclick="irA('reservar')">← Volver</button>
    </div>
    <div id="panelConfig" class="oculto">
        <div class="caja">
            <h2>📋 Historial de Turnos</h2>
            <div class="filtros">
                <button class="filtro activo" onclick="cambiarFiltro('todos')">Todos</button>
                <button class="filtro" onclick="cambiarFiltro('pendientes')">⏳ Pendientes</button>
                <button class="filtro" onclick="cambiarFiltro('atendidos')">✅ Atendidos</button>
            </div>
            <div class="lista" id="listaTurnos"></div>
        </div>
        <button class="btn-chico-gris" style="margin-top:15px; width:auto;" onclick="irA('reservar')">← Volver a la página principal</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const CONTRASEÑA = 'admin123';
const TU_WHATSAPP = '5492984548329'; // Tu número SIN espacios ni símbolos
const HORARIOS_FIJOS = ['09:00','09:30','10:00','10:30','11:00','11:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00'];
let filtroActual = 'todos';

const firebaseConfig = {
  apiKey: "AIzaSyAe-Ysqg7w8HzQ707MEqd4tiqH7qZWHGMA",
  authDomain: "mistico-barberia.firebaseapp.com",
  databaseURL: "https://mistico-barberia-default-rtdb.firebaseio.com",
  projectId: "mistico-barberia",
  storageBucket: "mistico-barberia.firebasestorage.app",
  messagingSenderId: "314274452478",
  appId: "1:314274452478:web:a1a2e2d7e163576d52a6af",
  measurementId: "G-E9M4WL67JH"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refTurnos = db.ref('turnos');

refTurnos.on('value', () => {
    if(!document.getElementById('panelConfig').classList.contains('oculto')) listarTurnos();
    cargarHorariosDisponibles();
});

function irA(pagina){
    document.getElementById('reservar').classList.add('oculto');
    document.getElementById('admin').classList.add('oculto');
    document.getElementById(pagina).classList.remove('oculto');
    if(pagina==='reservar'){
        document.getElementById('selFecha').min = new Date().toISOString().split('T')[0];
    }
    if(pagina==='admin') listarTurnos();
}

function ingresar(){
    if(document.getElementById('passAdmin').value === CONTRASEÑA){
        document.getElementById('cajaPass').classList.add('oculto');
        document.getElementById('panelConfig').classList.remove('oculto');
        listarTurnos();
    }else alert('❌ Contraseña incorrecta');
}

async function cargarHorariosDisponibles(){
    const barbero = document.getElementById('selBarbero').value;
    const fecha = document.getElementById('selFecha').value;
    const selH = document.getElementById('selHora');
    
    if(!barbero || !fecha) {
        for(let i=0; i<selH.options.length; i++){
            selH.options[i].disabled = false;
            selH.options[i].style.color = '';
        }
        return;
    }

    const snap = await refTurnos.once('value');
    const turnos = Object.values(snap.val() || {}).filter(t => !t.atendido);
    
    for(let i=0; i<selH.options.length; i++){
        const hora = selH.options[i].value;
        if(!hora) continue;
        const ocupado = turnos.some(t => t.barbero === barbero && t.fecha === fecha && t.hora === hora);
        selH.options[i].disabled = ocupado;
        selH.options[i].style.color = ocupado ? '#e74c3c' : '';
    }
    
    if(selH.value && selH.querySelector(`option[value="${selH.value}"]`)?.disabled){
        selH.value = '';
    }
}

function limpiarNumero(numero){
    // Deja SOLO números, quita +, espacios, guiones, paréntesis
    return numero.replace(/\D/g, '');
}

async function generarTurno(){
    const nombre = document.getElementById('inpNombre').value.trim();
    const barbero = document.getElementById('selBarbero').value;
    const servicio = document.getElementById('selServicio').value;
    const fecha = document.getElementById('selFecha').value;
    const hora = document.getElementById('selHora').value;
    const tel = document.getElementById('inpTel').value.trim();

    if(!nombre||!barbero||!servicio||!fecha||!hora||!tel){
        alert('⚠️ Completá TODOS los campos'); return;
    }

    const snap = await refTurnos.once('value');
    const turnos = Object.values(snap.val() || {}).filter(t => !t.atendido);
    if(turnos.some(t => t.barbero === barbero && t.fecha === fecha && t.hora === hora)){
        alert('❌ ¡Ese horario ya fue reservado! Elegí otro.');
        cargarHorariosDisponibles(); return;
    }

    await refTurnos.push({ barbero, fecha, hora, nombre, telefono:tel, servicio, atendido:false });

    const mensaje = `Hola! Quisiera reservar un turno en MÍSTICO:

👤 Nombre: ${nombre}
📞 Mi WhatsApp: ${tel}
✂️ Barbero: ${barbero}
💇 Servicio: ${servicio}
📅 Fecha: ${fecha}
⏰ Hora: ${hora}

¡Gracias!`;

    // LIMPIA EL NÚMERO PARA QUE WHATSAPP LO RECONOZCA BIEN
    const numeroLimpio = limpiarNumero(TU_WHATSAPP);
    const enlaceWA = `https://wa.me/${numeroLimpio}?text=${encodeURIComponent(mensaje)}`;

    document.getElementById('formRes').classList.add('oculto');
    document.getElementById('confirmado').classList.remove('oculto');
    document.getElementById('rNombre').textContent = nombre;
    document.getElementById('rBarbero').textContent = barbero;
    document.getElementById('rServicio').textContent = servicio;
    document.getElementById('rFecha').textContent = fecha;
    document.getElementById('rHora').textContent = hora;
    document.getElementById('botonWA').href = enlaceWA;
    
    console.log('Enlace WhatsApp:', enlaceWA); // Para ver en consola si hay error
}

function volver(){
    document.getElementById('formRes').classList.remove('oculto');
    document.getElementById('confirmado').classList.add('oculto');
    document.getElementById('inpNombre').value='';
    document.getElementById('selBarbero').value='';
    document.getElementById('selServicio').value='';
    document.getElementById('selFecha').value='';
    document.getElementById('selHora').value='';
    document.getElementById('inpTel').value='';
}

function cambiarFiltro(filtro){
    filtroActual = filtro;
    document.querySelectorAll('.filtro').forEach(b=>b.classList.remove('activo'));
    event.target.classList.add('activo');
    listarTurnos();
}

async function listarTurnos(){
    const c = document.getElementById('listaTurnos'); c.innerHTML='';
    const snap = await refTurnos.once('value');
    const turnosObj = snap.val() || {};
    let turnos = Object.entries(turnosObj).map(([id, t]) => ({...t, id}));
    
    if(turnos.length === 0){
        c.innerHTML = '<p style="color:#888; font-size:14px; text-align:center; padding:30px 20px;">No hay turnos registrados</p>';
        return;
    }

    turnos = turnos.sort((a,b)=> new Date(b.fecha+'T'+b.hora) - new Date(a.fecha+'T'+a.hora));
    if(filtroActual === 'pendientes') turnos = turnos.filter(t=>!t.atendido);
    if(filtroActual === 'atendidos') turnos = turnos.filter(t=>t.atendido);

    turnos.forEach(t=>{
        c.innerHTML += `
            <div class="item ${t.atendido?'atendido':''}">
                <div style="flex:1; min-width:200px;">
                    <strong>${t.nombre}</strong>
                    ${t.atendido?'<span class="etiqueta-atendido">✅ ATENDIDO</span>':''}
                    <br><small style="color:#999;">${t.barbero} · ${t.servicio}</small>
                    <br><small style="color:#d4af37;">📅 ${t.fecha} ⏰ ${t.hora}</small>
                </div>
                <div class="fila">
                    ${!t.atendido
                        ?`<button class="btn-chico-ok" onclick="marcarAtendido('${t.id}')">✅ Atendido</button>`
                        :`<button class="btn-chico-gris" onclick="desmarcarAtendido('${t.id}')">↩️ Deshacer</button>`
                    }
                    <button class="btn-rojo" onclick="borrarTurno('${t.id}')">🗑️</button>
                </div>
            </div>
        `;
    });
}

async function marcarAtendido(id){ await refTurnos.child(id).update({atendido:true}); }
async function desmarcarAtendido(id){ await refTurnos.child(id).update({atendido:false}); }
async function borrarTurno(id){ if(!confirm('¿Eliminar este turno definitivamente?')) return; await refTurnos.child(id).remove(); }

document.getElementById('selFecha').min = new Date().toISOString().split('T')[0];
</script>

</body>
    </html>
