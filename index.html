<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÍSTICO — Reserva de Turnos</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body{background:#0a0f2b; color:#e0e0ff; padding:20px; max-width:580px; margin:0 auto; min-height:100vh;}
        .cabecera{text-align:center; padding:20px; margin-bottom:15px;}
        .logo{max-width:130px; margin-bottom:8px;}
        h1{color:#d4af37; font-size:30px; letter-spacing:4px;}
        .subtitulo{color:#9999cc; font-size:14px; margin-top:5px;}

        .oculto{display:none !important;}
        .caja{background:#1a1f45; padding:22px; border-radius:12px; margin-bottom:20px; border:1px solid rgba(212,175,55,0.2);}
        h2{color:#d4af37; font-size:18px; margin-bottom:18px; padding-bottom:8px; border-bottom:1px solid rgba(212,175,55,0.2);}
        
        label{display:block; margin:12px 0 5px; color:#b0b0e0; font-size:14px;}
        input, select, button{width:100%; padding:12px; border:none; border-radius:6px; font-size:15px;}
        input, select{background:#0f1433; color:#fff; border:2px solid rgba(212,175,55,0.2); outline:none;}
        input:focus, select:focus{border-color:#d4af37;}
        
        .btn{padding:12px 20px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;}
        .btn-amarillo{background:#d4af37; color:#000; margin-top:10px; width:100%; font-size:16px;}
        .btn-amarillo:hover{background:#e0c860;}
        .btn-verde{background:#25D366; color:#fff; margin-top:15px; width:100%; font-size:16px; text-decoration:none; display:block; text-align:center;}
        .btn-rojo{background:#e74c3c; color:#fff; padding:6px 10px; font-size:12px; width:auto;}
        .btn-chico-verde{background:#27ae60; color:#fff; padding:8px 12px; font-size:14px; width:auto;}
        .btn-chico-gris{background:#666; color:#fff; padding:6px 10px; font-size:12px; width:auto;}
        .btn-chico-ok{background:#27ae60; color:#fff; padding:6px 10px; font-size:12px; width:auto;}
        
        .fila{display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap;}
        .fila input{flex:1; margin:0;}
        .fila .precio{width:100px; flex:none;}
        
        .lista{margin-top:12px;}
        .item{display:flex; justify-content:space-between; align-items:center; padding:12px; background:#0f1433; border-radius:6px; margin-bottom:8px; border-left:3px solid #d4af37; flex-wrap:wrap; gap:8px;}
        .item .precio{color:#d4af37; font-weight:bold;}
        .item.atendido{border-left-color:#27ae60; opacity:0.75;}
        .item.atendido span{text-decoration:line-through;}
        
        .resumen{background:#0f1433; padding:15px; border-radius:8px; margin:15px 0; line-height:2;}
        .resumen strong{color:#d4af37;}
        .exito{color:#2ecc71; font-size:18px; font-weight:bold; text-align:center; margin:15px 0;}
        .etiqueta-atendido{background:#27ae60; color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:8px;}
        .filtros{display:flex; gap:8px; margin-bottom:15px; flex-wrap:wrap;}
        .filtro{padding:6px 12px; background:transparent; border:1px solid #666; color:#ccc; border-radius:20px; font-size:13px; cursor:pointer; width:auto;}
        .filtro.activo{border-color:#d4af37; color:#d4af37; background:rgba(212,175,55,0.1);}
        .btn-admin-pequeño{position:fixed; top:10px; right:10px; background:transparent; border:none; color:#666; font-size:20px; cursor:pointer; z-index:100;}
        .pass-box{max-width:320px; margin:0 auto; text-align:center;}
        .bloqueado{opacity:0.5; pointer-events:none;}
        .cargando{text-align:center; padding:40px 20px; color:#d4af37; font-size:16px;}
    </style>
</head>
<body>

<button class="btn-admin-pequeño" onclick="irA('admin')" title="Solo para dueño">⚙️</button>

<div class="cabecera">
    <img src="https://i.imgur.com/8ZxXQfL.png" alt="Logo Místico" class="logo" onerror="this.style.display='none'">
    <h1>MÍSTICO</h1>
    <p class="subtitulo">Reserva de Turnos</p>
</div>

<div class="nav">
    <button class="btn-nav activo" id="btnRes" onclick="irA('reservar')">📅 Reservar Turno</button>
</div>

<div id="cargando" class="cargando">🔄 Conectando...<br><small style="color:#888; font-size:13px;">Un momento por favor</small></div>

<!-- ============== SECCIÓN RESERVA ============== -->
<div id="reservar" class="oculto">
    <div class="caja">
        <h2>📅 Pedí tu Turno</h2>
        <div id="formRes">
            <label>Barbero *</label>
            <select id="selBarbero" onchange="cargarHorariosDisponibles()">
                <option value="">— Elegí —</option>
            </select>

            <label>Servicio *</label>
            <select id="selServicio">
                <option value="">— Elegí —</option>
            </select>

            <label>Fecha *</label>
            <input type="date" id="selFecha" onchange="cargarHorariosDisponibles()">

            <label>Horario *</label>
            <select id="selHora">
                <option value="">— Elegí barbero y fecha —</option>
            </select>

            <label>Tu Nombre Completo *</label>
            <input type="text" id="inpNombre" placeholder="Ej: Juan Pérez">

            <label>Tu WhatsApp / Teléfono *</label>
            <input type="tel" id="inpTel" placeholder="+54 9 294 ...">

            <button class="btn btn-amarillo" onclick="generarTurno()">✅ ARMAR TURNO</button>
        </div>

        <div id="confirmado" class="oculto">
            <div class="exito">✅ ¡TURNO CONFIRMADO!</div>
            <div class="resumen">
                <strong>Nombre:</strong> <span id="rNombre"></span><br>
                <strong>Barbero:</strong> <span id="rBarbero"></span><br>
                <strong>Servicio:</strong> <span id="rServicio"></span><br>
                <strong>Fecha:</strong> <span id="rFecha"></span><br>
                <strong>Hora:</strong> <span id="rHora"></span>
            </div>
            <a id="botonWA" class="btn btn-verde" href="" target="_blank">💬 ENVIAR POR WHATSAPP</a>
            <button class="btn btn-amarillo" style="background:#444; color:#fff;" onclick="volver()">🔄 Volver</button>
        </div>
    </div>
</div>

<!-- ============== PANEL DE CONTROL ============== -->
<div id="admin" class="oculto">
    <div class="caja pass-box" id="cajaPass">
        <h2 style="text-align:center; border:none;">🔒 Panel de Control</h2>
        <input type="password" id="passAdmin" placeholder="Contraseña">
        <button class="btn btn-amarillo" onclick="ingresar()">Entrar</button>
        <button class="btn btn-chico-gris" style="margin-top:10px; width:auto;" onclick="irA('reservar')">← Volver</button>
    </div>

    <div id="panelConfig" class="bloqueado">
        <div class="caja">
            <h2>👨‍🦱 Barberos</h2>
            <div class="fila">
                <input type="text" id="nuevoBarbero" placeholder="Nombre del barbero">
                <button class="btn-chico-verde" onclick="agregarBarbero()">+ Agregar</button>
            </div>
            <div class="lista" id="listaBarberos"></div>
        </div>

        <div class="caja">
            <h2>⏰ Horarios</h2>
            <div class="fila">
                <input type="text" id="nuevoHorario" placeholder="Ej: 14:30">
                <button class="btn-chico-verde" onclick="agregarHorario()">+ Agregar</button>
            </div>
            <div class="lista" id="listaHorarios"></div>
        </div>

        <div class="caja">
            <h2>💇 Servicios y Precios</h2>
            <div class="fila">
                <input type="text" id="nuevoServicio" placeholder="Nombre del servicio">
                <input type="number" id="precioServicio" class="precio" placeholder="$">
                <button class="btn-chico-verde" onclick="agregarServicio()">+ Agregar</button>
            </div>
            <div class="lista" id="listaServicios"></div>
        </div>

        <div class="caja">
            <h2>📋 Historial de Turnos</h2>
            <div class="filtros">
                <button class="filtro activo" onclick="cambiarFiltro('todos')">Todos</button>
                <button class="filtro" onclick="cambiarFiltro('pendientes')">⏳ Pendientes</button>
                <button class="filtro" onclick="cambiarFiltro('atendidos')">✅ Atendidos</button>
            </div>
            <div class="lista" id="listaTurnos"></div>
        </div>

        <button class="btn btn-chico-gris" style="margin-top:10px; width:auto;" onclick="irA('reservar')">← Volver a la página principal</button>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const CONTRASEÑA = 'admin123';
const TU_WHATSAPP = '5492984548329';
let filtroActual = 'todos';
let db = null;

// ==============================================================
// TUS DATOS DE FIREBASE YA CONFIGURADOS ✅
// ==============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAe-Ysqg7w8HzQ707MEqd4tiqH7qZWHGMA",
  authDomain: "mistico-barberia.firebaseapp.com",
  databaseURL: "https://mistico-barberia-default-rtdb.firebaseio.com",
  projectId: "mistico-barberia",
  storageBucket: "mistico-barberia.firebasestorage.app",
  messagingSenderId: "314274452478",
  appId: "1:314274452478:web:a1a2e2d7e163576d52a6af",
  measurementId: "G-E9M4WL67JH"
};

// Iniciar Firebase
firebase.initializeApp(firebaseConfig);
db = firebase.database();

// Referencias
const refBarberos = db.ref('barberos');
const refHorarios = db.ref('horarios');
const refServicios = db.ref('servicios');
const refTurnos = db.ref('turnos');

// Escuchar cambios en tiempo real
refBarberos.on('value', () => { cargarSelectoresReserva(); if(!document.getElementById('admin').classList.contains('oculto')) listarBarberos(); });
refHorarios.on('value', () => { cargarSelectoresReserva(); if(!document.getElementById('admin').classList.contains('oculto')) listarHorarios(); });
refServicios.on('value', () => { cargarSelectoresReserva(); if(!document.getElementById('admin').classList.contains('oculto')) listarServicios(); });
refTurnos.on('value', () => { if(!document.getElementById('admin').classList.contains('oculto')) listarTurnos(); });

// Ocultar cargando cuando está listo
setTimeout(()=>{
    document.getElementById('cargando').style.display = 'none';
    document.getElementById('reservar').classList.remove('oculto');
    document.getElementById('selFecha').min = new Date().toISOString().split('T')[0];
}, 1500);

function irA(pagina){
    document.getElementById('reservar').classList.add('oculto');
    document.getElementById('admin').classList.add('oculto');
    document.getElementById(pagina).classList.remove('oculto');
    
    if(pagina==='reservar'){
        cargarSelectoresReserva();
        document.getElementById('selFecha').min = new Date().toISOString().split('T')[0];
    }
    if(pagina==='admin') listarTodo();
}

function ingresar(){
    if(document.getElementById('passAdmin').value === CONTRASEÑA){
        document.getElementById('cajaPass').classList.add('oculto');
        document.getElementById('panelConfig').classList.remove('bloqueado');
        listarTodo();
    }else alert('❌ Contraseña incorrecta');
}

// ===== BARBEROS =====
async function agregarBarbero(){
    const nom = document.getElementById('nuevoBarbero').value.trim();
    if(!nom) return;
    const snap = await refBarberos.once('value');
    const lista = snap.val() || [];
    lista.push(nom);
    await refBarberos.set(lista);
    document.getElementById('nuevoBarbero').value='';
}
async function listarBarberos(){
    const snap = await refBarberos.once('value');
    const lista = snap.val() || [];
    const c = document.getElementById('listaBarberos'); c.innerHTML='';
    lista.forEach((b,i)=> c.innerHTML += `<div class="item"><span>${b}</span><button class="btn-rojo" onclick="eliminarB(${i})">X</button></div>`);
}
async function eliminarB(i){
    const snap = await refBarberos.once('value');
    const lista = snap.val(); lista.splice(i,1);
    await refBarberos.set(lista);
}

// ===== HORARIOS =====
async function agregarHorario(){
    const h = document.getElementById('nuevoHorario').value.trim();
    if(!h) return;
    const snap = await refHorarios.once('value');
    const lista = snap.val() || [];
    lista.push(h);
    await refHorarios.set(lista);
    document.getElementById('nuevoHorario').value='';
}
async function listarHorarios(){
    const snap = await refHorarios.once('value');
    const lista = snap.val() || [];
    const c = document.getElementById('listaHorarios'); c.innerHTML='';
    lista.forEach((h,i)=> c.innerHTML += `<div class="item"><span>${h}</span><button class="btn-rojo" onclick="eliminarH(${i})">X</button></div>`);
}
async function eliminarH(i){
    const snap = await refHorarios.once('value');
    const lista = snap.val(); lista.splice(i,1);
    await refHorarios.set(lista);
}

// ===== SERVICIOS =====
async function agregarServicio(){
    const nom = document.getElementById('nuevoServicio').value.trim();
    const pre = parseInt(document.getElementById('precioServicio').value);
    if(!nom||!pre) return;
    const snap = await refServicios.once('value');
    const lista = snap.val() || [];
    lista.push({nombre:nom, precio:pre});
    await refServicios.set(lista);
    document.getElementById('nuevoServicio').value=''; document.getElementById('precioServicio').value='';
}
async function listarServicios(){
    const snap = await refServicios.once('value');
    const lista = snap.val() || [];
    const c = document.getElementById('listaServicios'); c.innerHTML='';
    lista.forEach((s,i)=> c.innerHTML += `<div class="item"><span>${s.nombre}</span><span class="precio">$${s.precio}</span><button class="btn-rojo" onclick="eliminarS(${i})">X</button></div>`);
}
async function eliminarS(i){
    const snap = await refServicios.once('value');
    const lista = snap.val(); lista.splice(i,1);
    await refServicios.set(lista);
}

// ===== TURNOS =====
async function cargarSelectoresReserva(){
    const [bSnap, sSnap] = await Promise.all([refBarberos.once('value'), refServicios.once('value')]);
    const barberos = bSnap.val() || [];
    const servicios = sSnap.val() || [];
    
    const selB = document.getElementById('selBarbero');
    const selS = document.getElementById('selServicio');

    selB.innerHTML = '<option value="">— Elegí barbero —</option>';
    barberos.forEach(x=> selB.innerHTML += `<option value="${x}">${x}</option>`);

    selS.innerHTML = '<option value="">— Elegí servicio —</option>';
    servicios.forEach(x=> selS.innerHTML += `<option value="${x.nombre}">${x.nombre} — $${x.precio}</option>`);
}

async function cargarHorariosDisponibles(){
    const barbero = document.getElementById('selBarbero').value;
    const fecha = document.getElementById('selFecha').value;
    const selH = document.getElementById('selHora');
    
    selH.innerHTML = '<option value="">— Elegí horario —</option>';
    if(!barbero || !fecha) return;

    const [hSnap, tSnap] = await Promise.all([refHorarios.once('value'), refTurnos.once('value')]);
    const horarios = hSnap.val() || [];
    const turnos = Object.values(tSnap.val() || {}).filter(t => !t.atendido);

    horarios.forEach(hora => {
        const yaOcupado = turnos.some(t => t.barbero === barbero && t.fecha === fecha && t.hora === hora);
        if(!yaOcupado) selH.innerHTML += `<option value="${hora}">${hora}</option>`;
    });
}

async function generarTurno(){
    const nombre = document.getElementById('inpNombre').value.trim();
    const barbero = document.getElementById('selBarbero').value;
    const servicio = document.getElementById('selServicio').value;
    const fecha = document.getElementById('selFecha').value;
    const hora = document.getElementById('selHora').value;
    const tel = document.getElementById('inpTel').value.trim();

    if(!nombre||!barbero||!servicio||!fecha||!hora||!tel){
        alert('⚠️ Completá TODOS los campos'); return;
    }

    const tSnap = await refTurnos.once('value');
    const turnos = Object.values(tSnap.val() || {}).filter(t => !t.atendido);
    if(turnos.some(t => t.barbero === barbero && t.fecha === fecha && t.hora === hora)){
        alert('❌ ¡Ese horario ya fue reservado! Elegí otro.');
        cargarHorariosDisponibles(); return;
    }

    const nuevoTurno = { barbero, fecha, hora, nombre, telefono:tel, servicio, atendido:false };
    await refTurnos.push(nuevoTurno);

    const mensaje = `Hola! Quisiera reservar un turno en MÍSTICO:

👤 Nombre: ${nombre}
📞 Mi WhatsApp: ${tel}
✂️ Barbero: ${barbero}
💇 Servicio: ${servicio}
📅 Fecha: ${fecha}
⏰ Hora: ${hora}

¡Gracias!`;

    document.getElementById('formRes').classList.add('oculto');
    document.getElementById('confirmado').classList.remove('oculto');
    document.getElementById('rNombre').textContent = nombre;
    document.getElementById('rBarbero').textContent = barbero;
    document.getElementById('rServicio').textContent = servicio;
    document.getElementById('rFecha').textContent = fecha;
    document.getElementById('rHora').textContent = hora;
    document.getElementById('botonWA').href = `https://wa.me/${TU_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
}

function volver(){
    document.getElementById('formRes').classList.remove('oculto');
    document.getElementById('confirmado').classList.add('oculto');
    document.getElementById('inpNombre').value='';
    document.getElementById('selBarbero').value='';
    document.getElementById('selServicio').value='';
    document.getElementById('selFecha').value='';
    document.getElementById('selHora').innerHTML='<option value="">— Elegí barbero y fecha —</option>';
    document.getElementById('inpTel').value='';
}

function cambiarFiltro(filtro){
    filtroActual = filtro;
    document.querySelectorAll('.filtro').forEach(b=>b.classList.remove('activo'));
    event.target.classList.add('activo');
    listarTurnos();
}

async function listarTurnos(){
    const c = document.getElementById('listaTurnos'); c.innerHTML='';
    const snap = await refTurnos.once('value');
    const turnosObj = snap.val() || {};
    let turnos = Object.entries(turnosObj).map(([id, t]) => ({...t, id}));
    
    if(turnos.length === 0){
        c.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; padding:20px;">No hay turnos registrados</p>';
        return;
    }

    turnos = turnos.sort((a,b)=> new Date(b.fecha+'T'+b.hora) - new Date(a.fecha+'T'+a.hora));
    if(filtroActual === 'pendientes') turnos = turnos.filter(t=>!t.atendido);
    if(filtroActual === 'atendidos') turnos = turnos.filter(t=>t.atendido);

    turnos.forEach(t=>{
        c.innerHTML += `
            <div class="item ${t.atendido?'atendido':''}">
                <div style="flex:1; min-width:200px;">
                    <strong>${t.nombre}</strong>
                    ${t.atendido?'<span class="etiqueta-atendido">✅ ATENDIDO</span>':''}
                    <br><small style="color:#999;">${t.barbero} · ${t.servicio}</small>
                    <br><small style="color:#d4af37;">📅 ${t.fecha} ⏰ ${t.hora}</small>
                </div>
                <div class="fila">
                    ${!t.atendido
                        ?`<button class="btn-chico-ok" onclick="marcarAtendido('${t.id}')">✅ Atendido</button>`
                        :`<button class="btn-chico-gris" onclick="desmarcarAtendido('${t.id}')">↩️ Deshacer</button>`
                    }
                    <button class="btn-rojo" onclick="borrarTurno('${t.id}')">🗑️</button>
                </div>
            </div>
        `;
    });
}

async function marcarAtendido(id){
    await refTurnos.child(id).update({atendido:true});
